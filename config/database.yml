default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  # Connection pool optimization for Rails 8.0.4
  checkout_timeout: 5
  reaping_frequency: 10
  idle_timeout: 300

development:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
  database: <%= ENV.fetch('POSTGRES_DB', 'portfolio_rb_development') %>
  username: <%= ENV.fetch('POSTGRES_USER', 'portfolio') %>
  password: <%= ENV['POSTGRES_PASSWORD'] %>
  host: <%= ENV.fetch('POSTGRES_HOST', 'db') %>
  port: <%= ENV.fetch('POSTGRES_PORT', '5432') %>

test:
  <<: *default
  database: portfolio_rb_test
  username: <%= ENV.fetch('POSTGRES_USER', 'portfolio') %>
  password: <%= ENV['POSTGRES_PASSWORD'] %>
  host: <%= ENV.fetch('POSTGRES_HOST', 'db') %>
  port: <%= ENV.fetch('POSTGRES_PORT', '5432') %>

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
  cache:
    <<: *primary_production
    database: portfolio_rb_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: portfolio_rb_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: portfolio_rb_production_cable
    migrations_paths: db/cable_migrate
